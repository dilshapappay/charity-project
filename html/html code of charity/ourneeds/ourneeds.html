<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurNeeds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="ourneeds.css">
</head>
<body>
    <div class="header">
        <div class="logo">DONATENOW</div>
        <div class="search-bar">
             <i class="fas fa-search"></i>
          <input type="text" placeholder="Search">
         
        </div>
        <button>Login</button>
      </div>
      <div class="filters">
        <select>
          <option>District</option>
          <option>thiruvananthapuram</option>
          <option>kollam</option>
          <option>pathanamthitta</option>
          <option>aalapuzha</option>
          <option>kottayam</option>
          <option>edukki</option>
          <option>eranamkulam</option>
          <option>thrissur</option>
          <option>palakkad</option>
          <option>malappuram</option>
          <option>kozhicode</option>
          <option>wayanad</option>
          <option>kannur</option>
          <option>kasarcode</option>
        </select>
        <select>
          <option>Categories</option>
          <option>Clothing</option>
          <option>Educational Supplies</option>
        </select>
      </div>
      <div>
        <div class="section-title">Clothing & Accessories</div>
        <div class="card-container">
          <div class="card">
            <img src="/photos/tshirt.png" alt="T-shirt">
            <h3>T-shirt</h3>
            <p>Needed: 2</p>
            <p>Camp: palakkad</p>
            <button>Donate</button>
          </div>
          <div class="card"></div>
          <div class="card"></div>
          <div class="card"></div>
        </div>
        <div>
            <div class="section-title">Educational Supplies</div>
            <div class="card-container">
              <div class="card">
                <img src="https://via.placeholder.com/200" alt="Book">
                <h3>Books</h3>
                <p>Needed: 5</p>
                <button>Donate</button>
              </div>
              <div class="card"></div>
              <div class="card"></div>
              <div class="card"></div>
            </div>
</body>
</html>
